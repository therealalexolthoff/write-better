<!-- Source for the installed-app icons (icon-180/192/512.png). Same design as
     favicon.svg, but full-bleed and with the mark inside the central 80% so
     phones can crop it to a circle or rounded square ("maskable"). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#971b2f"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <text x="32" y="43" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#fff">W</text>
    <rect x="16" y="49" width="32" height="5" rx="2.5" fill="#00b5e2"/>
  </g>
</svg>
